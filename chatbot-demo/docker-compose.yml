services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: he-thong-ho-tro-cam-xuc:week1
    container_name: he-thong-ho-tro-cam-xuc

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STREAMLIT_SERVER_RUN_ON_SAVE: "true"
      DEBUG_SIDEBAR: ${DEBUG_SIDEBAR:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql://capstone:capstone@db:5432/capstone}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}

    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - chroma_data:/app/vector_store
      - ./eval:/app/eval

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: he-thong-ho-tro-cam-xuc-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capstone}
      POSTGRES_DB: ${POSTGRES_DB:-capstone}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capstone} -d ${POSTGRES_DB:-capstone}"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: he-thong-ho-tro-cam-xuc:week1
    container_name: he-thong-ho-tro-cam-xuc-api
    entrypoint: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-*}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://capstone:capstone@db:5432/capstone}
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - chroma_data:/app/vector_store
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  chroma_data:
